<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#315e83"><title>Mes premiers pas en lecture</title>
<style>
:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#19364d;background:#f5f9fb}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:4px solid #e59b31;outline-offset:3px}.shell{max-width:790px;margin:auto;padding:22px 16px 55px}header{display:flex;justify-content:space-between;gap:15px;align-items:center}h1{font-size:clamp(1.6rem,5vw,2.4rem);margin:.25em 0;color:#245579}h2{font-size:clamp(1.35rem,4vw,1.8rem);margin:.3em 0}.sub{margin:.3em 0 1.5em;line-height:1.45;color:#426277}.pill{border:1px solid #c8dce6;border-radius:40px;padding:8px 13px;background:white;font-weight:700;white-space:nowrap}.panel{background:white;border:1px solid #dbe8ee;border-radius:25px;padding:clamp(20px,5vw,34px);box-shadow:0 10px 30px #2455790b}.levels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.level{display:flex;flex-direction:column;align-items:flex-start;text-align:left;min-height:150px;border:2px solid #d2e5ed;background:#fff;border-radius:20px;padding:19px;color:#19364d}.level:hover,.choice:hover:not(:disabled),.tile:hover:not(:disabled){border-color:#4389b3;background:#f4fafe}.level .icon{font-size:1.7rem}.level strong{font-size:1.16rem;margin:6px 0}.level small{line-height:1.35;color:#547084}.level .done{margin-top:auto;color:#22715d;font-weight:700}.back{background:transparent;border:0;color:#245579;font-weight:700;padding:10px 0;margin-bottom:10px}.bar{height:12px;border-radius:20px;background:#e2edf2;overflow:hidden;margin:12px 0 23px}.bar span{display:block;height:100%;background:#61aa90;border-radius:20px;transition:width .3s}.step{font-weight:700;color:#426277}.prompt{text-align:center;font-size:1.2rem;line-height:1.45;margin:18px 0}.target{font-weight:750;font-size:clamp(2.8rem,11vw,5rem);text-align:center;letter-spacing:.035em;color:#245579;line-height:1.2;margin:18px 0 25px}.sentence{font-size:clamp(1.6rem,6vw,2.4rem);letter-spacing:0;line-height:1.4}.sound{display:block;margin:20px auto 27px;background:#e5f1fb;color:#174e76;border:2px solid #9cc8e3;border-radius:16px;padding:15px 22px;min-height:60px;font-weight:750}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.choice,.tile{min-height:72px;border:2px solid #c8dce6;border-radius:17px;background:#fff;color:#183b54;padding:11px;font-size:clamp(1.35rem,5vw,2rem);font-weight:700}.picture{font-size:3rem;line-height:1.3}.picture span{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.choice.correct,.tile.correct{border-color:#2d916f;background:#e2f6e8}.choice.wrong,.tile.wrong{border-color:#d58476;background:#fff0ed}.build{min-height:77px;border:2px dashed #a8c7d5;border-radius:17px;margin:16px 0 20px;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;padding:8px}.placed{border:1px solid #87b9d0;border-radius:12px;background:#e5f1fb;color:#245579;padding:10px 15px;font-size:1.8rem;font-weight:700}.tiles{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.tile{min-width:93px}.feedback{min-height:55px;text-align:center;font-weight:750;font-size:1.17rem;padding:12px 0;color:#247155}.feedback.error{color:#a84f42}.next{display:block;width:100%;min-height:60px;border:0;border-radius:16px;background:#245f85;color:white;font-size:1.15rem;font-weight:750}.next:disabled{background:#b8cbd5;cursor:default}.muted{color:#567184}.footer{margin-top:22px;font-size:.88rem;color:#5e7786;text-align:center} .celebrate{text-align:center;font-size:3.3rem}.center{text-align:center} .smallbtn{border:1px solid #bfd4df;color:#245579;background:white;border-radius:12px;padding:10px 14px;font-weight:700;margin-top:20px}@media(max-width:540px){.levels{grid-template-columns:1fr}.level{min-height:114px}.choices{gap:9px}.choice{min-height:83px}.picture{font-size:2.4rem}}@media(prefers-reduced-motion:reduce){.bar span{transition:none}}
</style>
</head>
<body><div class="shell"><header><h1>Mes premiers pas en lecture</h1><div class="pill" id="starCount">☆ 0 étoile</div></header><p class="sub">On commence par les voyelles, puis on assemble des syllabes. Un adulte peut accompagner les premières minutes.</p><main id="app"></main><div class="footer">Sans publicité · Sans chronomètre · Progression gardée sur cet appareil</div></div>
<script>
'use strict';
const levels=[
 {name:'Je découvre les voyelles',icon:'👂',desc:'Écoute et retrouve a, i, o et u.',type:'listen',items:[
  {say:'a',options:['a','i','o','u'],answer:'a'},
  {say:'i',options:['o','u','i','a'],answer:'i'},
  {say:'o',options:['u','o','a','i'],answer:'o'},
  {say:'u',options:['i','a','u','o'],answer:'u'},
  {say:'a',options:['u','o','i','a'],answer:'a'},
  {say:'i',options:['a','i','u','o'],answer:'i'}]},
 {name:'Je lis mes premières syllabes',icon:'🔤',desc:'Avec m, l, p et t : ma, li, po…',type:'listen',items:[
  {say:'ma',options:['ma','mi','mo','mu'],answer:'ma'},
  {say:'li',options:['la','li','lo','lu'],answer:'li'},
  {say:'po',options:['pa','pi','po','pu'],answer:'po'},
  {say:'tu',options:['ta','ti','to','tu'],answer:'tu'},
  {say:'mi',options:['ma','mo','mi','mu'],answer:'mi'},
  {say:'la',options:['lo','la','li','lu'],answer:'la'},
  {say:'to',options:['ta','ti','tu','to'],answer:'to'},
  {say:'pa',options:['pi','po','pa','pu'],answer:'pa'}]},
 {name:'Je construis des mots',icon:'🧩',desc:'Deux syllabes à assembler, sans piège.',type:'build',items:[
  {word:'papa',parts:['pa','pa'],pool:['pa','li','pa']},
  {word:'papi',parts:['pa','pi'],pool:['pi','mo','pa']},
  {word:'moto',parts:['mo','to'],pool:['to','mo','la']},
  {word:'lama',parts:['la','ma'],pool:['ma','pi','la']},
  {word:'loto',parts:['lo','to'],pool:['to','ma','lo']},
  {word:'tata',parts:['ta','ta'],pool:['ta','mi','ta']}]},
 {name:'Je reconnais des mots',icon:'📖',desc:'Lis un mot court et trouve son image.',type:'picture',items:[
  {word:'moto',options:[['🏍️','moto'],['🚲','vélo'],['🚗','voiture'],['🚌','bus']],answer:'moto'},
  {word:'lama',options:[['🐕','chien'],['🦙','lama'],['🐈','chat'],['🐟','poisson']],answer:'lama'},
  {word:'papa',options:[['👨','papa'],['👴','papi'],['🐕','chien'],['🦙','lama']],answer:'papa'},
  {word:'papi',options:[['👨','papa'],['👴','papi'],['🏍️','moto'],['🦙','lama']],answer:'papi'}]}
];
const app=document.getElementById('app');let progress={};try{progress=JSON.parse(localStorage.getItem('lecture-progress-v1')||'{}')||{}}catch{}let level=-1,index=0,locked=false,answered=false,selected=[],available=[];
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function save(){try{localStorage.setItem('lecture-progress-v1',JSON.stringify(progress))}catch{}updateStars()}
function updateStars(){let n=Object.values(progress).filter(Boolean).length;document.getElementById('starCount').textContent='☆ '+n+' étoile'+(n>1?'s':'')}
function speak(s){if(!('speechSynthesis' in window)){notice('La lecture audio n’est pas disponible dans ce navigateur.',true);return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang='fr-FR';u.rate=.78;u.pitch=1;u.onerror=()=>notice('Le son ne fonctionne pas ici. Vérifie le volume et réessaie.',true);speechSynthesis.speak(u)}
function notice(s,error=false){const f=document.getElementById('feedback');if(f){f.textContent=s;f.className='feedback'+(error?' error':'')}}
function home(){window.speechSynthesis?.cancel();level=-1;updateStars();app.innerHTML='<div class="levels">'+levels.map((l,i)=>`<button class="level" data-level="${i}"><span class="icon" aria-hidden="true">${l.icon}</span><strong>${esc(l.name)}</strong><small>${esc(l.desc)}</small>${progress[i]?'<span class="done">★ Terminé</span>':''}</button>`).join('')+'</div><p class="center"><button class="smallbtn" id="reset">Recommencer la progression</button></p>';app.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>start(Number(b.dataset.level)));document.getElementById('reset').onclick=()=>{if(confirm('Effacer les étoiles gagnées sur cet appareil ?')){progress={};save();home()}}}
function start(n){level=n;index=0;render()}
function render(){locked=false;answered=false;selected=[];let l=levels[level],q=l.items[index];available=l.type==='build'?q.pool.map((value,id)=>({value,id})):[];let content='';if(l.type==='listen')content=`<p class="prompt">Écoute, puis touche ce que tu entends.</p><button class="sound" id="play">▶ Écouter le son</button><div class="choices">${q.options.map(v=>`<button class="choice" data-answer="${esc(v)}">${esc(v)}</button>`).join('')}</div>`;
if(l.type==='build')content=`<p class="prompt">Écoute le mot, puis touche les syllabes dans le bon ordre.</p><button class="sound" id="play">▶ Écouter le mot</button><div class="build" id="build" aria-label="Mot en cours de construction"><span class="muted">Ton mot apparaîtra ici</span></div><div class="tiles" id="tiles"></div><p class="center"><button class="smallbtn" id="undo">Effacer la dernière syllabe</button></p>`;
if(l.type==='picture')content=`<p class="prompt">Lis ce mot et touche le bon dessin.</p><div class="target">${esc(q.word)}</div><div class="choices">${q.options.map(([icon,label])=>`<button class="choice picture" data-answer="${esc(label)}" aria-label="${esc(label)}">${icon}<span>${esc(label)}</span></button>`).join('')}</div>`;
if(l.type==='sentence')content=`<p class="prompt">Lis cette phrase et choisis le bon dessin.</p><div class="target sentence">${esc(q.line)}</div><div class="choices">${q.options.map(([icon,label])=>`<button class="choice picture" data-answer="${esc(label)}" aria-label="${esc(label)}">${icon}<span>${esc(label)}</span></button>`).join('')}</div>`;
app.innerHTML=`<button class="back" id="back">← Tous les jeux</button><div class="panel"><h2>${l.icon} ${esc(l.name)}</h2><div class="step">Défi ${index+1} sur ${l.items.length}</div><div class="bar" role="progressbar" aria-valuenow="${index}" aria-valuemax="${l.items.length}" aria-label="Progression"><span style="width:${index/l.items.length*100}%"></span></div>${content}<div id="feedback" class="feedback" role="status" aria-live="polite"></div><button class="next" id="next" disabled>${index===l.items.length-1?'Terminer':'Défi suivant →'}</button></div>`;
document.getElementById('back').onclick=home;document.getElementById('next').onclick=()=>{if(!answered)return;if(index<l.items.length-1){index++;render()}else finish()};let play=document.getElementById('play');if(play)play.onclick=()=>speak(l.type==='listen'?q.say:q.word);
if(l.type==='build'){renderTiles();document.getElementById('undo').onclick=()=>{if(locked||!selected.length)return;available.push(selected.pop());renderTiles();renderBuild();notice('')};return}app.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>choose(b,q.answer,l.type==='listen'?q.say:null));}
function choose(b,answer,sound){if(locked)return;if(b.dataset.answer===answer){locked=true;answered=true;b.classList.add('correct');app.querySelectorAll('[data-answer]').forEach(x=>x.disabled=true);notice('Bravo, tu as trouvé !');document.getElementById('next').disabled=false;if(sound)speak(sound)}else{b.classList.add('wrong');b.disabled=true;notice('Essaie encore, tu peux y arriver.',true)}}
function renderTiles(){const t=document.getElementById('tiles');t.innerHTML=available.map(({value,id})=>`<button class="tile" data-id="${id}">${esc(value)}</button>`).join('');t.querySelectorAll('button').forEach(b=>b.onclick=()=>pick(Number(b.dataset.id)))}
function renderBuild(){const b=document.getElementById('build');b.innerHTML=selected.length?selected.map(x=>`<span class="placed">${esc(x.value)}</span>`).join(''):'<span class="muted">Ton mot apparaîtra ici</span>'}
function pick(id){if(locked)return;let i=available.findIndex(x=>x.id===id);if(i<0)return;selected.push(available.splice(i,1)[0]);renderBuild();renderTiles();let q=levels[level].items[index];let n=selected.length;if(selected[n-1].value!==q.parts[n-1]){notice('Essaie une autre syllabe.',true);available.push(selected.pop());renderBuild();renderTiles();return}notice('');if(n===q.parts.length){locked=true;answered=true;app.querySelectorAll('.tile').forEach(x=>x.disabled=true);notice('Bravo ! Tu as construit « '+q.word+' ».');document.getElementById('next').disabled=false;speak(q.word)}}
function finish(){progress[level]=true;save();const name=levels[level].name;app.innerHTML=`<div class="panel center"><div class="celebrate" aria-hidden="true">⭐</div><h2>Bravo, tu as terminé !</h2><p>Tu as réussi le parcours « ${esc(name)} ».</p><button class="next" id="again">Rejouer ce parcours</button><button class="smallbtn" id="menu">Choisir un autre parcours</button></div>`;document.getElementById('again').onclick=()=>start(level);document.getElementById('menu').onclick=home}
updateStars();home();
</script></body></html>
