function speak(s){const info=audioSources[s];if(!info){notice('Ce son n’est pas disponible.',true);return}if(activeAudio){activeAudio.pause();activeAudio.currentTime=0}activeAudio=new Audio(info[0]);activeAudio.onerror=()=>notice('Le son n’a pas pu être chargé. Vérifie la connexion Internet.',true);activeAudio.play().catch(()=>notice('Le son n’a pas pu démarrer. Réessaie en touchant le bouton.',true))}

function notice(s,error=false){const f=document.getElementById('feedback');if(f){f.textContent=s;f.className='feedback'+(error?' error':'')}}
function home(){if(activeAudio){activeAudio.pause();activeAudio=null}level=-1;updateStars();app.innerHTML='<div class="levels">'+levels.map((l,i)=>`<button class="level" data-level="${i}"><span class="icon" aria-hidden="true">${l.icon}</span><strong>${esc(l.name)}</strong><small>${esc(l.desc)}</small>${progress[i]?'<span class="done">★ Terminé</span>':''}</button>`).join('')+'</div><p class="center"><button class="smallbtn" id="reset">Recommencer la progression</button></p>';app.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>start(Number(b.dataset.level)));document.getElementById('reset').onclick=()=>{if(confirm('Effacer les étoiles gagnées sur cet appareil ?')){progress={};save();home()}}}
function start(n){level=n;index=0;render()}
function render(){locked=false;answered=false;selected=[];let l=levels[level],q=l.items[index];available=l.type==='build'?q.pool.map((value,id)=>({value,id})):[];let content='';if(l.type==='listen')content=`<p class="prompt">Écoute, puis touche ce que tu entends.</p><button class="sound" id="play">▶ Écouter le son</button><div class="choices">${q.options.map(v=>`<button class="choice" data-answer="${esc(v)}">${esc(v)}</button>`).join('')}</div>`;
if(l.type==='build')content=`<p class="prompt">Écoute le mot, puis touche les syllabes dans le bon ordre.</p><button class="sound" id="play">▶ Écouter le mot</button><div class="build" id="build" aria-label="Mot en cours de construction"><span class="muted">Ton mot apparaîtra ici</span></div><div class="tiles" id="tiles"></div><p class="center"><button class="smallbtn" id="undo">Effacer la dernière syllabe</button></p>`;
if(l.type==='picture')content=`<p class="prompt">Lis ce mot et touche le bon dessin.</p><div class="target">${esc(q.word)}</div><div class="choices">${q.options.map(([icon,label])=>`<button class="choice picture" data-answer="${esc(label)}" aria-label="${esc(label)}">${icon}<span>${esc(label)}</span></button>`).join('')}</div>`;
if(l.type==='sentence')content=`<p class="prompt">Lis cette phrase et choisis le bon dessin.</p><div class="target sentence">${esc(q.line)}</div><div class="choices">${q.options.map(([icon,label])=>`<button class="choice picture" data-answer="${esc(label)}" aria-label="${esc(label)}">${icon}<span>${esc(label)}</span></button>`).join('')}</div>`;
app.innerHTML=`<button class="back" id="back">← Tous les jeux</button><div class="panel"><h2>${l.icon} ${esc(l.name)}</h2><div class="step">Défi ${index+1} sur ${l.items.length}</div><div class="bar" role="progressbar" aria-valuenow="${index}" aria-valuemax="${l.items.length}" aria-label="Progression"><span style="width:${index/l.items.length*100}%"></span></div>${content}<div id="feedback" class="feedback" role="status" aria-live="polite"></div><button class="next" id="next" disabled>${index===l.items.length-1?'Terminer':'Défi suivant →'}</button></div>`;
document.getElementById('back').onclick=home;document.getElementById('next').onclick=()=>{if(!answered)return;if(index<l.items.length-1){index++;render()}else finish()};let play=document.getElementById('play');if(play)play.onclick=()=>speak(l.type==='listen'?q.say:q.word);
if(l.type==='build'){renderTiles();document.getElementById('undo').onclick=()=>{if(locked||!selected.length)return;available.push(selected.pop());renderTiles();renderBuild();notice('')};return}app.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>choose(b,q.answer,l.type==='listen'?q.say:null));}
function choose(b,answer,sound){if(locked)return;if(b.dataset.answer===answer){locked=true;answered=true;b.classList.add('correct');app.querySelectorAll('[data-answer]').forEach(x=>x.disabled=true);notice('Bravo, tu as trouvé !');document.getElementById('next').disabled=false;if(sound)speak(sound)}else{b.classList.add('wrong');b.disabled=true;notice('Essaie encore, tu peux y arriver.',true)}}
function renderTiles(){const t=document.getElementById('tiles');t.innerHTML=available.map(({value,id})=>`<button class="tile" data-id="${id}">${esc(value)}</button>`).join('');t.querySelectorAll('button').forEach(b=>b.onclick=()=>pick(Number(b.dataset.id)))}
function renderBuild(){const b=document.getElementById('build');b.innerHTML=selected.length?selected.map(x=>`<span class="placed">${esc(x.value)}</span>`).join(''):'<span class="muted">Ton mot apparaîtra ici</span>'}
function pick(id){if(locked)return;let i=available.findIndex(x=>x.id===id);if(i<0)return;selected.push(available.splice(i,1)[0]);renderBuild();renderTiles();let q=levels[level].items[index];let n=selected.length;if(selected[n-1].value!==q.parts[n-1]){notice('Essaie une autre syllabe.',true);available.push(selected.pop());renderBuild();renderTiles();return}notice('');if(n===q.parts.length){locked=true;answered=true;app.querySelectorAll('.tile').forEach(x=>x.disabled=true);notice('Bravo ! Tu as construit « '+q.word+' ».');document.getElementById('next').disabled=false;speak(q.word)}}
function finish(){progress[level]=true;save();const name=levels[level].name;app.innerHTML=`<div class="panel center"><div class="celebrate" aria-hidden="true">⭐</div><h2>Bravo, tu as terminé !</h2><p>Tu as réussi le parcours « ${esc(name)} ».</p><button class="next" id="again">Rejouer ce parcours</button><button class="smallbtn" id="menu">Choisir un autre parcours</button></div>`;document.getElementById('again').onclick=()=>start(level);document.getElementById('menu').onclick=home}
const creditBox=document.createElement('details');creditBox.className='footer';creditBox.innerHTML='<summary>Crédits des enregistrements</summary><p>Sons enregistrés par des locuteurs français et hébergés sur Wikimedia Commons. Les mots isolés « lit », « peau », « pas » et « taux » servent à faire entendre respectivement li, po, pa et to. Certains extraits ont été raccourcis et normalisés. Une connexion Internet est nécessaire pour les autres sons.</p><ul style="text-align:left">'+Object.entries(audioSources).map(([key,info])=>'<li>'+esc(key)+' : <a href="https://commons.wikimedia.org/wiki/File:'+encodeURIComponent(info[1])+'" target="_blank" rel="noopener">'+esc(info[2])+' — '+esc(info[1])+'</a> ('+esc(info[3])+')</li>').join('')+'</ul><p>Licences : <a href="https://creativecommons.org/licenses/by/2.0/fr/">CC BY 2.0 FR</a>, <a href="https://creativecommons.org/licenses/by-sa/2.0/fr/">CC BY-SA 2.0 FR</a>, <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>, <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a>.</p>';document.querySelector('.shell').appendChild(creditBox);
updateStars();home();
</script></body></html>
